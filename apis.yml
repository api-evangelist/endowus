name: Endowus
description: >-
  Endowus is a Singapore- and Hong Kong-based digital wealth management platform founded in 2017 by
  Gregory Van and Samuel Rhee. It gives retail, accredited, and private-wealth clients access to
  low-fee institutional share-class funds, advised and self-directed portfolios, and private-market
  and alternatives strategies across Cash, CPF (Central Provident Fund), and SRS (Supplementary
  Retirement Scheme) accounts. Its conflict-free model rebates 100% of trailer fees and fund-manager
  commissions to clients. Endowus is licensed by the Monetary Authority of Singapore (CMS License
  101051), serves 300,000+ clients, and manages over US$10 billion in assets. It was added to the API
  Evangelist network as a portfolio-company lead; the company operates consumer apps but publishes no
  public developer API or documentation at this time.
